<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'">
  <title>Accueil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body class="s2 dark">
  <div id="wallpaper"></div>

  <header id="topbar">
    <div id="user">
      <div id="avatar"></div>
      <span id="username"></span>
    </div>
    <div id="status">
      <span id="clock"></span>
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM4.9 13.4l1.4 1.4a8 8 0 0 1 11.4 0l1.4-1.4a10 10 0 0 0-14.2 0zM1.4 9.9l1.4 1.4a13 13 0 0 1 18.4 0l1.4-1.4a15 15 0 0 0-21.2 0zM8.5 16.9 12 20.4l3.5-3.5a5 5 0 0 0-7 0z"/></svg>
      <span id="battery"><span id="batt-level"></span><b id="batt-fill"></b></span>
    </div>
  </header>

  <main id="home">
    <div id="game-title"></div>
    <div id="row-wrap"><div id="games"></div></div>
    <nav id="dock"></nav>
  </main>

  <footer id="hints">
    <div class="left" title="Manette connectée">
      <!-- Clin d'œil rétro : manette 16 bits (corps en os de chien, croix, 4 boutons colorés) -->
      <svg class="handheld retro" viewBox="0 0 60 26">
        <path class="shell" d="M13 1h34a12 12 0 0 1 0 24c-4 0-6-2-9-4H22c-3 2-5 4-9 4a12 12 0 0 1 0-24z"/>
        <!-- croix directionnelle -->
        <circle cx="13" cy="13" r="7.5" class="well"/>
        <path class="dpad" d="M11.3 7.5h3.4v3.8h3.8v3.4h-3.8v3.8h-3.4v-3.8H7.5v-3.4h3.8z"/>
        <!-- Select / Start -->
        <rect x="23" y="12" width="5" height="2" rx="1" transform="rotate(-30 25.5 13)" class="mini"/>
        <rect x="31" y="12" width="5" height="2" rx="1" transform="rotate(-30 33.5 13)" class="mini"/>
        <!-- boutons d'action -->
        <circle cx="47" cy="13" r="8" class="well"/>
        <circle cx="47" cy="7.8" r="2.4" fill="#3b6fd8"/>
        <circle cx="52.2" cy="13" r="2.4" fill="#d83b3b"/>
        <circle cx="47" cy="18.2" r="2.4" fill="#e8c21c"/>
        <circle cx="41.8" cy="13" r="2.4" fill="#2fa84f"/>
      </svg>
      <span id="pad-name"></span>
    </div>
    <div class="right">
      <span class="hint" id="hint-options"><b class="pm">−/+</b> Options</span>
      <span class="hint"><b class="round">A</b> Démarrer</span>
    </div>
  </footer>

  <div id="modal-layer"></div>
  <div id="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
